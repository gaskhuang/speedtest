<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蓋斯克網路測速 · 專業診斷</title>
  <meta name="description" content="蓋斯克科技專業級網路測速工具，測量下載、上傳、延遲、抖動、丟包與 Bufferbloat，並比對台灣與全球平均值，找出您的網路瓶頸。">
  <style>
    :root {
      --bg: #070b16;
      --bg-2: #0c1324;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-2: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #eaf0ff;
      --muted: #93a1c0;
      --muted-2: #6b7899;
      --brand: #3b82f6;
      --brand-2: #06d6d6;
      --accent: #8b5cf6;
      --good: #22c55e;
      --warn: #f59e0b;
      --poor: #ef4444;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      line-height: 1.6;
      background:
        radial-gradient(1200px 600px at 15% -5%, rgba(59, 130, 246, 0.18), transparent 60%),
        radial-gradient(1000px 600px at 110% 10%, rgba(139, 92, 246, 0.16), transparent 55%),
        radial-gradient(900px 700px at 50% 120%, rgba(6, 214, 214, 0.10), transparent 60%),
        var(--bg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 34px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo { height: 52px; width: auto; display: block; }
    .brand-sub { font-size: 17px; color: var(--muted); font-weight: 500;
      padding-left: 14px; border-left: 1px solid var(--border-strong); }
    .badge-pill {
      font-size: 17px; color: var(--muted); border: 1px solid var(--border);
      background: var(--surface); padding: 6px 12px; border-radius: 999px;
      display: flex; align-items: center; gap: 7px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 10px var(--good); }

    /* ---------- Hero ---------- */
    .hero { text-align: center; margin-bottom: 26px; }
    .hero h1 {
      font-size: clamp(34px, 6vw, 54px); font-weight: 850; letter-spacing: -.5px;
      background: linear-gradient(120deg, #fff 20%, #a9c2ff 55%, #7ff0f0 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      line-height: 1.2;
    }
    .hero p { color: var(--muted); margin-top: 10px; font-size: 20px; }

    /* ---------- Gauge card ---------- */
    .stage {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--border); border-radius: 26px;
      padding: 30px 24px 26px; box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .gauge-wrap { display: flex; flex-direction: column; align-items: center; }
    .gauge { position: relative; width: 300px; max-width: 78vw; }
    .gauge svg { width: 100%; height: auto; display: block; overflow: visible; }
    .gauge-center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; pointer-events: none;
    }
    .gauge-phase {
      font-size: 18px; letter-spacing: 2px; color: var(--brand-2);
      text-transform: uppercase; font-weight: 700; min-height: 18px;
    }
    .gauge-value { font-size: 62px; font-weight: 850; line-height: 1; margin-top: 4px;
      font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgba(59,130,246,.35); }
    .gauge-unit { font-size: 20px; color: var(--muted); font-weight: 600; margin-top: 6px; }

    /* live chips under gauge */
    .live-chips {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      width: 100%; max-width: 560px; margin: 22px auto 0;
    }
    .chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 8px; text-align: center;
      transition: border-color .3s, transform .3s;
    }
    .chip.active { border-color: rgba(59,130,246,.55); transform: translateY(-2px); box-shadow: 0 8px 22px rgba(59,130,246,.18); }
    .chip .k { font-size: 16px; color: var(--muted-2); font-weight: 600; }
    .chip .v { font-size: 22px; font-weight: 800; margin-top: 3px; font-variant-numeric: tabular-nums; }
    .chip .u { font-size: 15px; color: var(--muted-2); }

    /* ---------- Buttons ---------- */
    .actions { display: flex; justify-content: center; gap: 14px; margin-top: 26px; flex-wrap: wrap; }
    .btn {
      appearance: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 21px; font-weight: 700; color: #fff; padding: 14px 30px;
      border-radius: 14px; display: inline-flex; align-items: center; gap: 9px;
      transition: transform .18s, box-shadow .18s, opacity .2s;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 12px 34px rgba(59, 130, 246, 0.42);
    }
    .btn-primary:hover { box-shadow: 0 16px 44px rgba(59, 130, 246, 0.6); transform: translateY(-2px); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; transform: none; }
    .btn-ghost { background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .btn svg { width: 24px; height: 24px; }

    /* ---------- Results ---------- */
    #results { margin-top: 26px; display: none; }
    .section { margin-top: 22px; }
    .section-title {
      font-size: 18px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
    }
    .section-title::before { content: ""; width: 4px; height: 15px; border-radius: 3px;
      background: linear-gradient(var(--brand), var(--brand-2)); }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
    }

    /* Verdict header */
    .verdict {
      display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
      background: linear-gradient(135deg, rgba(59,130,246,.10), rgba(139,92,246,.08));
      border: 1px solid var(--border-strong);
    }
    .score-ring { position: relative; width: 126px; height: 126px; flex-shrink: 0; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring .num {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .score-ring .num b { font-size: 44px; font-weight: 850; line-height: 1; }
    .score-ring .num span { font-size: 16px; color: var(--muted); }
    .verdict-body { flex: 1; min-width: 240px; }
    .verdict-rating { font-size: 28px; font-weight: 850; }
    .verdict-head { font-size: 20px; color: var(--text); margin-top: 8px; }
    .verdict-head b { color: #fff; }
    .verdict-sub { font-size: 18px; color: var(--muted); margin-top: 6px; }

    /* metric grid */
    .metric-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .metric {
      background: var(--surface); border: 1px solid var(--border); border-radius: 15px;
      padding: 16px; position: relative; overflow: hidden;
    }
    .metric .top { display: flex; justify-content: space-between; align-items: baseline; }
    .metric .label { font-size: 18px; color: var(--muted); font-weight: 600; }
    .metric .pill {
      font-size: 16px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
    }
    .metric .big { font-size: 34px; font-weight: 850; margin-top: 8px; font-variant-numeric: tabular-nums; }
    .metric .big small { font-size: 19px; color: var(--muted); font-weight: 600; }
    .metric .note { font-size: 17px; color: var(--muted-2); margin-top: 4px; }

    .pill-good { background: rgba(34,197,94,.16); color: #4ade80; }
    .pill-warn { background: rgba(245,158,11,.16); color: #fbbf24; }
    .pill-poor { background: rgba(239,68,68,.16); color: #f87171; }
    .t-good { color: var(--good); } .t-warn { color: var(--warn); } .t-poor { color: var(--poor); }

    /* benchmark bars */
    .bench-row { margin-bottom: 20px; }
    .bench-row:last-child { margin-bottom: 0; }
    .bench-head { display: flex; justify-content: space-between; font-size: 18px; margin-bottom: 10px; }
    .bench-head .name { font-weight: 700; }
    .bench-track { display: flex; flex-direction: column; gap: 8px; }
    .bar-line { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 10px; font-size: 17px; }
    .bar-line .who { color: var(--muted); }
    .bar-line .who.you { color: var(--text); font-weight: 700; }
    .bar-box { height: 12px; background: rgba(255,255,255,.05); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
    .bar-fill.you { background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
    .bar-fill.ref { background: rgba(255,255,255,.22); }
    .bar-line .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    .bar-line .val.you { color: var(--text); font-weight: 700; }
    .bench-note { font-size: 16px; color: var(--muted-2); margin-top: 14px; line-height: 1.5; }

    /* bufferbloat */
    .bloat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; text-align: center; }
    .bloat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 13px; padding: 14px 8px; }
    .bloat-cell .lab { font-size: 16px; color: var(--muted-2); }
    .bloat-cell .num { font-size: 30px; font-weight: 850; margin-top: 5px; font-variant-numeric: tabular-nums; }
    .bloat-cell .num small { font-size: 17px; color: var(--muted); }
    .bloat-grade { text-align: center; margin-top: 16px; font-size: 19px; }
    .grade-badge { display: inline-block; font-size: 28px; font-weight: 850; width: 40px; height: 40px;
      line-height: 40px; border-radius: 11px; margin-right: 8px; vertical-align: middle; }

    /* diagnosis */
    .diag { display: flex; gap: 14px; padding: 16px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .diag:last-child { margin-bottom: 0; }
    .diag .ico { flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 24px; }
    .diag.critical { border-color: rgba(239,68,68,.35); background: rgba(239,68,68,.06); }
    .diag.critical .ico { background: rgba(239,68,68,.16); }
    .diag.warning { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.05); }
    .diag.warning .ico { background: rgba(245,158,11,.16); }
    .diag.good .ico { background: rgba(34,197,94,.16); }
    .diag .body h4 { font-size: 20px; font-weight: 800; }
    .diag .body p { font-size: 18px; color: var(--muted); margin-top: 4px; }
    .diag .body .fix { font-size: 18px; color: #a9c2ff; margin-top: 7px; }
    .diag .body .fix b { color: #cdddff; }

    /* use cases */
    .uc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .uc {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 15px; display: flex; align-items: center; gap: 12px;
    }
    .uc .emoji { font-size: 30px; }
    .uc .uc-name { font-size: 19px; font-weight: 700; }
    .uc .uc-status { font-size: 17px; font-weight: 700; margin-top: 2px; }

    /* progress list (during test) */
    #phaseList { margin-top: 22px; display: none; }
    .plist { display: grid; gap: 10px; }
    .prow { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 12px;
      font-size: 19px; padding: 6px 0; }
    .prow .st { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border-strong); position: relative; }
    .prow.doing .st { border-color: var(--brand); }
    .prow.doing .st::after { content: ""; position: absolute; inset: 2px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: var(--brand); animation: spin .8s linear infinite; }
    .prow.done .st { border-color: var(--good); background: var(--good); }
    .prow.done .st::after { content: "✓"; position: absolute; inset: -3px; color: #04140a; font-size: 17px;
      font-weight: 900; display: grid; place-items: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prow .pname { color: var(--muted); }
    .prow.doing .pname, .prow.done .pname { color: var(--text); }
    .prow .pval { color: var(--brand-2); font-weight: 700; font-variant-numeric: tabular-nums; }

    .disclaimer { text-align: center; font-size: 17px; color: var(--muted-2); margin-top: 30px; line-height: 1.6; }
    .foot { text-align: center; margin-top: 26px; color: var(--muted-2); font-size: 17px; }
    .foot a { color: var(--muted); text-decoration: none; }

    @media (max-width: 560px) {
      .topbar { flex-wrap: wrap; gap: 12px; }
      .brand-sub { display: none; }
      .brand-logo { height: 42px; }
      .live-chips { grid-template-columns: repeat(2, 1fr); }
      .metric-grid { grid-template-columns: 1fr; }
      .bloat-grid { grid-template-columns: 1fr; }
      .bar-line { grid-template-columns: 96px 1fr 56px; }
      .verdict { justify-content: center; text-align: center; }
    }
  </style>
</head>

<body>
  <div class="wrap" id="capture-root">
    <div class="topbar">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="ZONE TECH 蓋斯克科技" width="651" height="181">
        <span class="brand-sub">Network Diagnostics</span>
      </div>
      <div class="badge-pill"><span class="dot"></span> Cloudflare 全球節點</div>
    </div>

    <div class="hero">
      <h1>網路速度與健康診斷</h1>
      <p>一次測出下載、上傳、延遲、抖動、丟包與 Bufferbloat，並對照台灣與全球平均，指出您的網路瓶頸。</p>
    </div>

    <div class="stage">
      <div class="gauge-wrap">
        <div class="gauge">
          <svg viewBox="0 0 200 200">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6" /><stop offset="100%" stop-color="#06d6d6" />
              </linearGradient>
            </defs>
            <!-- track: 270deg arc from 135deg to 405deg -->
            <circle id="gaugeTrack" cx="100" cy="100" r="86" fill="none"
              stroke="rgba(255,255,255,0.07)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="405.3 540.4" transform="rotate(135 100 100)" />
            <circle id="gaugeFill" cx="100" cy="100" r="86" fill="none"
              stroke="url(#gaugeGrad)" stroke-width="14" stroke-linecap="round"
              stroke-dasharray="0 540.4" transform="rotate(135 100 100)"
              style="transition: stroke-dasharray .35s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 8px rgba(59,130,246,.5));" />
          </svg>
          <div class="gauge-center">
            <div class="gauge-phase" id="gaugePhase">準備就緒</div>
            <div class="gauge-value" id="gaugeValue">0<span style="font-size:22px;color:var(--muted)"></span></div>
            <div class="gauge-unit" id="gaugeUnit">點擊下方開始測試</div>
          </div>
        </div>

        <div class="live-chips">
          <div class="chip" id="chip-download"><div class="k">下載</div><div class="v" id="lv-download">—</div><div class="u">Mbps</div></div>
          <div class="chip" id="chip-upload"><div class="k">上傳</div><div class="v" id="lv-upload">—</div><div class="u">Mbps</div></div>
          <div class="chip" id="chip-latency"><div class="k">延遲</div><div class="v" id="lv-latency">—</div><div class="u">ms</div></div>
          <div class="chip" id="chip-jitter"><div class="k">抖動</div><div class="v" id="lv-jitter">—</div><div class="u">ms</div></div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="startBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
          開始測速
        </button>
      </div>

      <div id="phaseList">
        <div class="plist">
          <div class="prow" id="prow-download"><div class="st"></div><div class="pname">下載速度</div><div class="pval" id="pv-download"></div></div>
          <div class="prow" id="prow-upload"><div class="st"></div><div class="pname">上傳速度</div><div class="pval" id="pv-upload"></div></div>
          <div class="prow" id="prow-latency"><div class="st"></div><div class="pname">延遲與抖動</div><div class="pval" id="pv-latency"></div></div>
          <div class="prow" id="prow-packetLoss"><div class="st"></div><div class="pname">封包遺失</div><div class="pval" id="pv-packetLoss"></div></div>
        </div>
      </div>
    </div>

    <div id="results"></div>

    <div class="foot">
      測速引擎：<a href="https://speed.cloudflare.com" target="_blank" rel="noopener">Cloudflare</a> 全球邊緣網路 · 蓋斯克科技 zonetech.tw
    </div>
  </div>

  <script type="module">
    import SpeedTest from 'https://cdn.skypack.dev/@cloudflare/speedtest';
    import html2canvas from 'https://cdn.skypack.dev/html2canvas';

    /* =========================================================
       業界參考基準值（Reference benchmarks）
       來源概念：Ookla Speedtest Global Index 級距、Cloudflare AIM
       這些為「業界典型參考值」，非即時官方統計，用於相對定位。
       ========================================================= */
    const BENCH = {
      download: { tw: 145, global: 95 },   // Mbps 固網典型中位級距
      upload:   { tw: 65,  global: 42 },   // Mbps
      latency:  { good: 30, avg: 60 },     // ms（越低越好）
      jitter:   { good: 10, avg: 30 },     // ms
      packetLoss: { good: 0.5, avg: 2 },   // %
      bufferbloat: { good: 30, avg: 60, poor: 150 } // ms 負載延遲增量
    };

    const $ = id => document.getElementById(id);
    const fmt = (n, d = 1) => (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(d);

    const gaugeFill = $('gaugeFill');
    const gaugePhase = $('gaugePhase');
    const gaugeValue = $('gaugeValue');
    const gaugeUnit = $('gaugeUnit');
    const startBtn = $('startBtn');
    const resultsEl = $('results');
    const phaseList = $('phaseList');
    const GAUGE_LEN = 540.4;           // 2πr, r=86
    const GAUGE_ARC = 405.3;           // 270deg visible arc

    let engine = null;
    let live = { download: 0, upload: 0, latency: 0, jitter: 0 };
    let animTimer = null;

    /* ---- gauge helpers ---- */
    // sqrt scale up to 1000 Mbps gives pleasant spread
    function speedToFrac(mbps) { return Math.max(0, Math.min(1, Math.sqrt(mbps / 1000))); }
    function setGaugeSpeed(mbps) {
      const frac = speedToFrac(mbps);
      gaugeFill.setAttribute('stroke-dasharray', `${(GAUGE_ARC * frac).toFixed(1)} ${GAUGE_LEN}`);
    }
    function setGaugeProgress(frac) {
      gaugeFill.setAttribute('stroke-dasharray', `${(GAUGE_ARC * Math.max(0, Math.min(1, frac))).toFixed(1)} ${GAUGE_LEN}`);
    }

    function setChip(kind, val) {
      const el = $('lv-' + kind);
      if (el) el.textContent = val;
    }
    function activeChip(kind) {
      ['download', 'upload', 'latency', 'jitter'].forEach(k =>
        $('chip-' + k).classList.toggle('active', k === kind));
    }
    function setRow(kind, state, val) {
      const row = $('prow-' + kind);
      if (!row) return;
      row.classList.remove('doing', 'done');
      if (state) row.classList.add(state);
      if (val !== undefined) $('pv-' + kind).textContent = val;
    }

    /* ---- run ---- */
    function resetUI() {
      resultsEl.style.display = 'none';
      resultsEl.innerHTML = '';
      phaseList.style.display = 'block';
      live = { download: 0, upload: 0, latency: 0, jitter: 0 };
      ['download', 'upload', 'latency', 'jitter'].forEach(k => setChip(k, '—'));
      ['download', 'upload', 'latency', 'packetLoss'].forEach(k => setRow(k, '', ''));
      setGaugeProgress(0);
      gaugeValue.innerHTML = '0';
      gaugePhase.textContent = '初始化';
      gaugeUnit.textContent = '連線至最近節點…';
    }

    function startTest() {
      if (engine) { try { engine.abort(); } catch (e) {} }
      if (animTimer) clearInterval(animTimer);
      resetUI();
      startBtn.disabled = true;
      startBtn.querySelector('svg').style.display = 'none';
      startBtn.childNodes[startBtn.childNodes.length - 1].textContent = ' 測試進行中…';

      engine = new SpeedTest({ autoStart: true });

      engine.onResultsChange = ({ type }) => {
        if (!engine) return;
        const s = engine.results.getSummary();

        if (type === 'download' && s.download) {
          live.download = s.download / 1e6;
          gaugePhase.textContent = '下載測試';
          activeChip('download');
          setChip('download', fmt(live.download, 1));
          setGaugeSpeed(live.download);
          gaugeValue.innerHTML = fmt(live.download, 1);
          gaugeUnit.textContent = 'Mbps 下載';
          setRow('download', 'doing');
        } else if (type === 'upload' && s.upload) {
          live.upload = s.upload / 1e6;
          gaugePhase.textContent = '上傳測試';
          activeChip('upload');
          setChip('upload', fmt(live.upload, 1));
          setGaugeSpeed(live.upload);
          gaugeValue.innerHTML = fmt(live.upload, 1);
          gaugeUnit.textContent = 'Mbps 上傳';
          setRow('download', 'done', fmt(live.download, 1) + ' Mbps');
          setRow('upload', 'doing');
        } else if (type === 'latency') {
          if (s.latency) { live.latency = s.latency; setChip('latency', fmt(s.latency, 0)); }
          if (s.jitter) { live.jitter = s.jitter; setChip('jitter', fmt(s.jitter, 1)); }
          gaugePhase.textContent = '延遲測試';
          activeChip('latency');
          gaugeValue.innerHTML = fmt(s.latency, 0);
          gaugeUnit.textContent = 'ms 延遲';
          setRow('upload', 'done', fmt(live.upload, 1) + ' Mbps');
          setRow('latency', 'doing');
        } else if (type === 'packetLoss') {
          setRow('latency', 'done', fmt(live.latency, 0) + ' ms / ' + fmt(live.jitter, 1) + ' ms');
          setRow('packetLoss', 'doing');
          gaugePhase.textContent = '封包測試';
        }
      };

      engine.onFinish = results => {
        const summary = results.getSummary();
        let scores = {};
        try { scores = results.getScores(); } catch (e) {}
        setRow('packetLoss', 'done',
          fmt((summary.packetLoss || 0) * 100, 1) + '%');
        setGaugeProgress(1);
        gaugePhase.textContent = '完成';
        gaugeValue.innerHTML = fmt((summary.download || 0) / 1e6, 0);
        gaugeUnit.textContent = 'Mbps 下載';
        activeChip(null);
        startBtn.disabled = false;
        startBtn.querySelector('svg').style.display = '';
        startBtn.childNodes[startBtn.childNodes.length - 1].textContent = ' 重新測速';
        setTimeout(() => renderReport(summary, scores), 400);
      };

      engine.onError = e => {
        gaugePhase.textContent = '發生錯誤';
        gaugeUnit.textContent = '請檢查網路後重試';
        startBtn.disabled = false;
        startBtn.querySelector('svg').style.display = '';
        startBtn.childNodes[startBtn.childNodes.length - 1].textContent = ' 重新測速';
        console.error(e);
      };
    }

    startBtn.addEventListener('click', startTest);

    /* =========================================================
       結果分析
       ========================================================= */
    function ratingByThreshold(val, goodAtOrAbove, warnAtOrAbove) {
      if (val >= goodAtOrAbove) return 'good';
      if (val >= warnAtOrAbove) return 'warn';
      return 'poor';
    }
    function ratingLowerBetter(val, goodBelow, warnBelow) {
      if (val <= goodBelow) return 'good';
      if (val <= warnBelow) return 'warn';
      return 'poor';
    }
    const pillClass = r => r === 'good' ? 'pill-good' : r === 'warn' ? 'pill-warn' : 'pill-poor';
    const pillText = r => r === 'good' ? '良好' : r === 'warn' ? '普通' : '偏弱';

    function renderReport(s, scores) {
      const dl = (s.download || 0) / 1e6;
      const ul = (s.upload || 0) / 1e6;
      const lat = s.latency || 0;
      const jit = s.jitter || 0;
      const loss = (s.packetLoss || 0) * 100;
      const dLat = s.downLoadedLatency || 0;
      const uLat = s.upLoadedLatency || 0;
      const worstLoaded = Math.max(dLat, uLat);
      const bloat = Math.max(0, worstLoaded - lat);

      const diag = analyze({ dl, ul, lat, jit, loss, bloat, dLat, uLat });
      const overall = scoreOverall({ dl, ul, lat, jit, loss, bloat });

      const html = `
        ${verdictCard(overall, diag)}
        ${metricsCard(dl, ul, lat, jit, loss, worstLoaded)}
        ${benchCard(dl, ul)}
        ${bufferbloatCard(lat, dLat, uLat, bloat)}
        ${diagnosisCard(diag)}
        ${useCaseCard({ dl, ul, lat, jit, loss, bloat })}
        <div class="actions" style="margin-top:26px">
          <button class="btn btn-primary" id="reBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36" /><path d="M21 3v6h-6" /></svg>
            再測一次
          </button>
          <button class="btn btn-ghost" id="saveBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="M7 10l5 5 5-5" /><path d="M12 15V3" /></svg>
            儲存報告圖片
          </button>
        </div>
        <div class="disclaimer">
          比較基準為業界典型參考值（概念參照 Ookla Speedtest Global Index 級距與 Cloudflare AIM 指標），
          非即時官方統計；實際體驗仍受服務商方案、Wi‑Fi 環境與時段影響。單次測試結果會有波動，建議不同時段多測幾次取平均。
        </div>`;
      resultsEl.innerHTML = html;
      resultsEl.style.display = 'block';
      phaseList.style.display = 'none';

      // animate benchmark bars in
      requestAnimationFrame(() => {
        document.querySelectorAll('.bar-fill').forEach(b => { b.style.width = b.dataset.w; });
        drawRing(overall.score);
      });

      $('reBtn').addEventListener('click', () => { resultsEl.scrollIntoView({ behavior: 'smooth' }); startTest(); });
      $('saveBtn').addEventListener('click', saveImage);
      resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* ---- diagnosis engine ---- */
    function analyze({ dl, ul, lat, jit, loss, bloat, dLat, uLat }) {
      const issues = [];

      // 1) Packet loss — 連線穩定性最關鍵
      if (loss > 2) issues.push({ sev: 'critical', weight: 100, area: '線路穩定性', ico: '📉',
        title: `封包遺失偏高（${fmt(loss, 1)}%）`,
        detail: '資料在傳輸途中大量遺失，通話會斷音、遊戲會瞬移、網頁會卡住重載。這通常是實體線路老化、接頭鬆脫、或無線干擾造成。',
        fix: '優先<b>改用網路線直連</b>路由器測試；若有線仍高，聯繫 ISP 檢修線路或數據機。' });
      else if (loss > BENCH.packetLoss.good) issues.push({ sev: 'warning', weight: 55, area: '線路穩定性', ico: '📉',
        title: `輕微封包遺失（${fmt(loss, 1)}%）`,
        detail: '偶發性遺失，一般瀏覽影響不大，但對即時語音／視訊會偶爾造成破碎。',
        fix: '觀察是否集中在特定時段；<b>換一條網路線、遠離微波爐與 2.4GHz 干擾源</b>。' });

      // 2) Bufferbloat — 負載下延遲暴增（專業關鍵指標）
      if (bloat > BENCH.bufferbloat.poor) issues.push({ sev: 'critical', weight: 95, area: 'Bufferbloat（緩衝膨脹）', ico: '🌊',
        title: `負載延遲暴增 +${fmt(bloat, 0)} ms`,
        detail: '一有人下載或上傳，延遲就從 ' + fmt(lat, 0) + ' ms 飆到 ' + fmt(lat + bloat, 0) + ' ms。這是典型的 Bufferbloat：路由器緩衝區塞爆，導致「有人在用網路時全家都變慢」。這往往比頻寬不足更影響實際體感。',
        fix: '在路由器<b>啟用 SQM／QoS（智慧佇列管理）</b>，或升級支援 fq_codel 的機種（如 OpenWrt、部分電競路由器）即可大幅改善。' });
      else if (bloat > BENCH.bufferbloat.avg) issues.push({ sev: 'warning', weight: 60, area: 'Bufferbloat（緩衝膨脹）', ico: '🌊',
        title: `負載時延遲上升 +${fmt(bloat, 0)} ms`,
        detail: '滿載時延遲中度增加，多人同時使用時，視訊與遊戲可能偶爾頓一下。',
        fix: '路由器<b>開啟 QoS</b>，並把上傳頻寬上限設為實測值的 ~90%，可壓下負載延遲。' });

      // 3) Idle latency 高 — 反應遲鈍
      if (lat > 120) issues.push({ sev: 'critical', weight: 80, area: '基礎延遲', ico: '🐌',
        title: `基礎延遲過高（${fmt(lat, 0)} ms）`,
        detail: '即使閒置，連到最近節點都要 ' + fmt(lat, 0) + ' ms。網頁點擊會有明顯遲滯，競技遊戲幾乎無法玩。可能是走了衛星／行動網路、路由繞遠、或 Wi‑Fi 訊號差。',
        fix: '改用<b>有線連線</b>確認是否為 Wi‑Fi 問題；若有線仍高，多半是 ISP 路由或線路型態限制。' });
      else if (lat > BENCH.latency.avg) issues.push({ sev: 'warning', weight: 45, area: '基礎延遲', ico: '🐌',
        title: `基礎延遲略高（${fmt(lat, 0)} ms）`,
        detail: '一般瀏覽與串流沒問題，但對延遲敏感的競技遊戲、視訊互動會略感遲鈍。',
        fix: '靠近路由器或<b>改用 5GHz／有線</b>；避免同時掛大量背景下載。' });

      // 4) Jitter 高 — 不穩
      if (jit > 50) issues.push({ sev: 'critical', weight: 70, area: '連線抖動', ico: '📶',
        title: `抖動過大（${fmt(jit, 1)} ms）`,
        detail: '延遲忽高忽低，代表連線很不穩。這是視訊會議破音、遊戲忽快忽慢的主因，通常來自 Wi‑Fi 干擾或線路品質不良。',
        fix: '<b>改用有線或切換 Wi‑Fi 頻道</b>；遠離其他無線裝置密集處。' });
      else if (jit > BENCH.jitter.avg) issues.push({ sev: 'warning', weight: 40, area: '連線抖動', ico: '📶',
        title: `抖動偏高（${fmt(jit, 1)} ms）`,
        detail: '連線穩定度普通，多數應用可用，但重要視訊會議可能偶有卡頓。',
        fix: '優先<b>使用 5GHz 或有線</b>連線以降低抖動。' });

      // 5) 下載頻寬不足
      if (dl < 25) issues.push({ sev: 'critical', weight: 75, area: '下載頻寬', ico: '⬇️',
        title: `下載速度偏慢（${fmt(dl, 1)} Mbps）`,
        detail: '低於台灣家庭常見水準（約 ' + BENCH.download.tw + ' Mbps），4K 串流、多人同時使用會吃力。可能是方案本身較低、Wi‑Fi 訊號衰減、或分享器瓶頸。',
        fix: '先<b>有線直測</b>排除 Wi‑Fi；若有線仍低，考慮升級 ISP 方案或檢查數據機是否老舊。' });
      else if (dl < BENCH.download.global) issues.push({ sev: 'warning', weight: 35, area: '下載頻寬', ico: '⬇️',
        title: `下載速度低於平均（${fmt(dl, 1)} Mbps）`,
        detail: '日常使用足夠，但低於全球平均（約 ' + BENCH.download.global + ' Mbps），多裝置同時看高畫質影片時可能互相排擠。',
        fix: '確認是否有背景裝置佔用；<b>靠近路由器或用有線</b>可拉高實測值。' });

      // 6) 上傳過低
      if (ul < 10) issues.push({ sev: 'warning', weight: 50, area: '上傳頻寬', ico: '⬆️',
        title: `上傳速度偏低（${fmt(ul, 1)} Mbps）`,
        detail: '視訊會議畫面可能糊、雲端備份與大檔上傳很慢。非對稱線路（如部分 Cable）上傳天生較低。',
        fix: '視訊會議者建議<b>升級對稱式光纖方案</b>；備份可排在離峰時段。' });

      // 排序：嚴重優先、權重高優先
      issues.sort((a, b) => (b.sev === 'critical') - (a.sev === 'critical') || b.weight - a.weight);
      return issues;
    }

    function scoreOverall({ dl, ul, lat, jit, loss, bloat }) {
      // 原始分（0-100，權重）
      const dS = Math.min(1, Math.sqrt(dl / 300));          // 300Mbps 封頂滿分
      const uS = Math.min(1, Math.sqrt(ul / 150));
      const lS = Math.max(0, 1 - lat / 150);
      const jS = Math.max(0, 1 - jit / 60);
      const pS = loss <= 0 ? 1 : Math.max(0, 1 - loss / 5);
      const bS = Math.max(0, 1 - bloat / 200);              // bufferbloat 納入評分
      let raw = (dS * 26 + uS * 14 + lS * 20 + jS * 14 + pS * 14 + bS * 12);

      // 短板封頂：任何關鍵指標很差就限制總分（避免高頻寬掩蓋爛穩定度）
      const critical = loss > 2 || bloat > 150 || lat > 120 || jit > 50 || dl < 25;
      const average = !critical && (loss > 0.5 || bloat > 60 || lat > 60 || jit > 30 || dl < 95);
      if (critical) raw = Math.min(raw, 59);
      else if (average) raw = Math.min(raw, 82);

      const score = Math.round(Math.max(3, raw));
      let rating, cls;
      if (score >= 90) { rating = '極佳'; cls = 'good'; }
      else if (score >= 80) { rating = '良好'; cls = 'good'; }
      else if (score >= 60) { rating = '普通'; cls = 'warn'; }
      else { rating = '偏弱'; cls = 'poor'; }
      return { score, rating, cls };
    }

    /* ---- report cards ---- */
    function verdictCard(overall, diag) {
      const top = diag.find(d => d.sev === 'critical') || diag.find(d => d.sev === 'warning');
      let headline, sub;
      if (!top) {
        headline = '沒有偵測到明顯瓶頸，各項指標都在健康範圍。';
        sub = '您的網路很適合高畫質串流、視訊會議與線上遊戲同時進行。';
      } else {
        headline = `主要瓶頸：<b>${top.area}</b> — ${top.title}`;
        const others = diag.filter(d => d !== top && d.sev !== 'good');
        sub = others.length
          ? `另外還偵測到 ${others.length} 項待改善（${others.map(o => o.area).join('、')}）。詳見下方診斷報告。`
          : '這是目前最值得優先處理的項目，詳見下方診斷報告。';
      }
      return `
      <div class="section">
        <div class="card verdict">
          <div class="score-ring">
            <svg width="126" height="126">
              <circle cx="63" cy="63" r="54" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="11" />
              <circle id="ringFill" cx="63" cy="63" r="54" fill="none" stroke="url(#gaugeGrad)" stroke-width="11"
                stroke-linecap="round" stroke-dasharray="0 339.3" />
            </svg>
            <div class="num"><b class="t-${overall.cls}">${overall.score}</b><span>/ 100</span></div>
          </div>
          <div class="verdict-body">
            <div class="verdict-rating t-${overall.cls}">網路健康度：${overall.rating}</div>
            <div class="verdict-head">${headline}</div>
            <div class="verdict-sub">${sub}</div>
          </div>
        </div>
      </div>`;
    }

    function metricCell(label, val, unit, rating, note) {
      return `
      <div class="metric">
        <div class="top"><span class="label">${label}</span>
          <span class="pill ${pillClass(rating)}">${pillText(rating)}</span></div>
        <div class="big t-${rating}">${val}<small> ${unit}</small></div>
        <div class="note">${note}</div>
      </div>`;
    }
    function metricsCard(dl, ul, lat, jit, loss, worstLoaded) {
      const rDl = ratingByThreshold(dl, BENCH.download.global, 25);
      const rUl = ratingByThreshold(ul, BENCH.upload.global, 10);
      const rLat = ratingLowerBetter(lat, BENCH.latency.good, BENCH.latency.avg);
      const rJit = ratingLowerBetter(jit, BENCH.jitter.good, BENCH.jitter.avg);
      const rLoss = ratingLowerBetter(loss, BENCH.packetLoss.good, BENCH.packetLoss.avg);
      const rLoad = ratingLowerBetter(worstLoaded, 60, 150);
      return `
      <div class="section">
        <div class="section-title">核心指標</div>
        <div class="metric-grid">
          ${metricCell('下載速度', fmt(dl, 1), 'Mbps', rDl, `約每秒 ${fmt(dl / 8, 1)} MB`)}
          ${metricCell('上傳速度', fmt(ul, 1), 'Mbps', rUl, `約每秒 ${fmt(ul / 8, 1)} MB`)}
          ${metricCell('延遲 Ping', fmt(lat, 0), 'ms', rLat, '閒置時的來回反應時間')}
          ${metricCell('抖動 Jitter', fmt(jit, 1), 'ms', rJit, '延遲的穩定程度')}
          ${metricCell('封包遺失', fmt(loss, 1), '%', rLoss, '資料傳輸的可靠度')}
          ${metricCell('負載延遲', fmt(worstLoaded, 0), 'ms', rLoad, '滿載時的最高延遲')}
        </div>
      </div>`;
    }

    function benchBar(label, you, ref, cap, unit) {
      const max = Math.max(you, ref.tw, ref.global, cap * 0.4);
      const w = v => Math.min(100, (v / max) * 100).toFixed(1) + '%';
      const youR = you >= ref.tw ? 'good' : you >= ref.global ? 'warn' : 'poor';
      return `
      <div class="bench-row">
        <div class="bench-head"><span class="name">${label}</span>
          <span class="t-${youR}" style="font-weight:700">${fmt(you, 1)} ${unit}</span></div>
        <div class="bench-track">
          <div class="bar-line"><span class="who you">您的網路</span>
            <div class="bar-box"><div class="bar-fill you" data-w="${w(you)}" style="width:0"></div></div>
            <span class="val you">${fmt(you, 0)}</span></div>
          <div class="bar-line"><span class="who">台灣平均</span>
            <div class="bar-box"><div class="bar-fill ref" data-w="${w(ref.tw)}" style="width:0"></div></div>
            <span class="val">${ref.tw}</span></div>
          <div class="bar-line"><span class="who">全球平均</span>
            <div class="bar-box"><div class="bar-fill ref" data-w="${w(ref.global)}" style="width:0"></div></div>
            <span class="val">${ref.global}</span></div>
        </div>
      </div>`;
    }
    function benchCard(dl, ul) {
      return `
      <div class="section">
        <div class="section-title">與市場平均比較</div>
        <div class="card">
          ${benchBar('下載速度', dl, BENCH.download, 500, 'Mbps')}
          ${benchBar('上傳速度', ul, BENCH.upload, 300, 'Mbps')}
          <div class="bench-note">
            ※「台灣平均／全球平均」為業界典型參考值（概念參照 Ookla Speedtest Global Index 固網中位級距），
            供相對定位使用，非即時官方數據。高於台灣平均代表您的頻寬在本地屬中上水準。
          </div>
        </div>
      </div>`;
    }

    function bufferbloatCard(lat, dLat, uLat, bloat) {
      let grade, gcls, gtext, gbg;
      if (bloat <= BENCH.bufferbloat.good) { grade = 'A'; gcls = 'good'; gbg = 'rgba(34,197,94,.16)'; gtext = '優異，負載下依然穩定，多人同時使用不打架。'; }
      else if (bloat <= BENCH.bufferbloat.avg) { grade = 'B'; gcls = 'good'; gbg = 'rgba(34,197,94,.14)'; gtext = '良好，滿載時延遲僅小幅上升。'; }
      else if (bloat <= BENCH.bufferbloat.poor) { grade = 'C'; gcls = 'warn'; gbg = 'rgba(245,158,11,.16)'; gtext = '中度膨脹，多人使用時互動類應用會偶爾卡頓。'; }
      else { grade = 'D'; gcls = 'poor'; gbg = 'rgba(239,68,68,.16)'; gtext = '嚴重膨脹，只要有人下載／上傳，全家連線就明顯變慢。'; }
      return `
      <div class="section">
        <div class="section-title">Bufferbloat 負載延遲分析</div>
        <div class="card">
          <div class="bloat-grid">
            <div class="bloat-cell"><div class="lab">閒置延遲</div><div class="num">${fmt(lat, 0)}<small> ms</small></div></div>
            <div class="bloat-cell"><div class="lab">下載時延遲</div><div class="num t-${gcls}">${fmt(dLat, 0)}<small> ms</small></div></div>
            <div class="bloat-cell"><div class="lab">上傳時延遲</div><div class="num t-${gcls}">${fmt(uLat, 0)}<small> ms</small></div></div>
          </div>
          <div class="bloat-grade">
            <span class="grade-badge t-${gcls}" style="background:${gbg}">${grade}</span>
            負載延遲增量 <b class="t-${gcls}">+${fmt(bloat, 0)} ms</b> · ${gtext}
          </div>
        </div>
      </div>`;
    }

    function diagnosisCard(diag) {
      if (!diag.length) {
        return `
        <div class="section">
          <div class="section-title">診斷報告</div>
          <div class="diag good">
            <div class="ico">✅</div>
            <div class="body"><h4>一切正常，沒有偵測到瓶頸</h4>
              <p>下載、上傳、延遲、抖動、丟包與 Bufferbloat 全數落在健康區間，這是一條體質很好的線路。</p>
              <div class="fix">維持建議：定期重開機路由器、韌體更新至最新版即可長期穩定。</div></div>
          </div>
        </div>`;
      }
      const rows = diag.map(d => `
        <div class="diag ${d.sev}">
          <div class="ico">${d.ico}</div>
          <div class="body">
            <h4>${d.title}</h4>
            <p>${d.detail}</p>
            <div class="fix">💡 建議：${d.fix}</div>
          </div>
        </div>`).join('');
      return `
      <div class="section">
        <div class="section-title">診斷報告 · 依嚴重度排序</div>
        ${rows}
      </div>`;
    }

    function useCaseCard({ dl, ul, lat, jit, loss, bloat }) {
      const cases = [
        { emoji: '🎬', name: '4K 高畫質串流', ok: dl >= 25 && loss < 2, warn: dl >= 15 },
        { emoji: '💼', name: '視訊會議', ok: ul >= 5 && jit < 30 && loss < 2 && bloat < 100, warn: ul >= 3 && loss < 4 },
        { emoji: '🎮', name: '競技線上遊戲', ok: lat < 50 && jit < 20 && loss < 1 && bloat < 80, warn: lat < 90 && loss < 2 },
        { emoji: '☁️', name: '雲端遊戲串流', ok: dl >= 25 && lat < 40 && bloat < 60, warn: dl >= 15 && lat < 70 },
        { emoji: '📤', name: '大檔上傳／備份', ok: ul >= 25, warn: ul >= 10 },
        { emoji: '👨‍👩‍👧', name: '多人同時使用', ok: dl >= 100 && bloat < 60, warn: dl >= 50 && bloat < 150 },
      ];
      const cells = cases.map(c => {
        const st = c.ok ? { t: '順暢', cls: 'good' } : c.warn ? { t: '勉強可用', cls: 'warn' } : { t: '不建議', cls: 'poor' };
        return `<div class="uc"><div class="emoji">${c.emoji}</div>
          <div><div class="uc-name">${c.name}</div>
          <div class="uc-status t-${st.cls}">${st.t}</div></div></div>`;
      }).join('');
      return `
      <div class="section">
        <div class="section-title">使用情境評估</div>
        <div class="uc-grid">${cells}</div>
      </div>`;
    }

    function drawRing(score) {
      const ring = $('ringFill');
      if (!ring) return;
      const C = 2 * Math.PI * 54; // 339.29
      const len = (Math.max(0, Math.min(100, score)) / 100) * C;
      ring.style.transition = 'stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)';
      ring.setAttribute('transform', 'rotate(-90 63 63)');
      requestAnimationFrame(() => ring.setAttribute('stroke-dasharray', `${len.toFixed(1)} ${C.toFixed(1)}`));
    }

    /* ---- save image ---- */
    async function saveImage() {
      const btn = $('saveBtn');
      const orig = btn.innerHTML;
      btn.innerHTML = '產生圖片中…';
      btn.disabled = true;
      const actionsBars = document.querySelectorAll('.actions');
      actionsBars.forEach(a => a.style.visibility = 'hidden');
      try {
        const canvas = await html2canvas($('capture-root'), {
          backgroundColor: '#070b16', scale: 2, logging: false,
          windowWidth: document.documentElement.scrollWidth
        });
        const now = new Date();
        const stamp = now.toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
        const link = document.createElement('a');
        link.download = `蓋斯克測速報告_${stamp}.jpg`;
        link.href = canvas.toDataURL('image/jpeg', 0.92);
        link.click();
      } catch (e) {
        console.error(e);
        alert('圖片產生失敗，請稍後再試。');
      } finally {
        actionsBars.forEach(a => a.style.visibility = '');
        btn.innerHTML = orig;
        btn.disabled = false;
        $('saveBtn').addEventListener('click', saveImage);
      }
    }
  </script>
</body>

</html>
